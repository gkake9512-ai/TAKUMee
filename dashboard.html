<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKUMee 架電ダッシュボード</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#222638;--bg4:#2a2f45;
  --text:#f0f2ff;--text2:#9aa0c0;--text3:#555e80;
  --border:#2e3452;
  --green:#4ade80;--green-bg:rgba(74,222,128,.1);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,.1);
  --yellow:#fbbf24;--yellow-bg:rgba(251,191,36,.1);
  --red:#f87171;--red-bg:rgba(248,113,113,.1);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,.1);
  --orange:#fb923c;--orange-bg:rgba(251,146,60,.1);
  --radius:10px;--radius-lg:16px;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:12px}
.app{max-width:780px;margin:0 auto}

/* ヘッダー */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:16px;border-bottom:0.5px solid var(--border)}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:var(--radius);background:linear-gradient(135deg,#3b5bdb,#7950f2);display:flex;align-items:center;justify-content:center;font-size:20px}
.header h1{font-size:18px;font-weight:700;color:var(--text)}
.header p{font-size:12px;color:var(--text3);margin-top:2px}
.last-update{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}

/* 期間フィルター */
.filter-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;border-radius:20px;border:0.5px solid var(--border);font-size:12px;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s;font-family:'Noto Sans JP',sans-serif}
.filter-btn.active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}

/* KPIカード */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;position:relative;overflow:hidden;transition:transform .15s}
.kpi-card:hover{transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.kpi-card.green::before{background:var(--green)}
.kpi-card.blue::before{background:var(--blue)}
.kpi-card.yellow::before{background:var(--yellow)}
.kpi-card.red::before{background:var(--red)}
.kpi-label{font-size:11px;color:var(--text3);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.kpi-num{font-size:32px;font-weight:700;font-family:'DM Mono',monospace;line-height:1}
.kpi-num.green{color:var(--green)}
.kpi-num.blue{color:var(--blue)}
.kpi-num.yellow{color:var(--yellow)}
.kpi-num.red{color:var(--red)}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-unit{font-size:14px;font-weight:400;margin-left:2px}

/* グリッドレイアウト */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}

/* カード */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:500;color:var(--text2);display:flex;align-items:center;gap:6px}
.card-title span{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}

/* 集計テーブル */
.stat-table{width:100%;border-collapse:collapse}
.stat-table th{font-size:10px;color:var(--text3);font-weight:500;padding:4px 8px;text-align:left;border-bottom:0.5px solid var(--border);letter-spacing:.5px}
.stat-table td{font-size:13px;padding:8px 8px;border-bottom:0.5px solid var(--border);color:var(--text)}
.stat-table tr:last-child td{border-bottom:none}
.stat-table td:last-child,.stat-table th:last-child{text-align:right;font-family:'DM Mono',monospace}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-未架電{background:var(--bg3);color:var(--text2)}
.badge-繋がらず{background:var(--yellow-bg);color:var(--yellow)}
.badge-再架電待ち{background:var(--blue-bg);color:var(--blue)}
.badge-架電済{background:var(--purple-bg);color:var(--purple)}
.badge-アポ獲得{background:var(--green-bg);color:var(--green)}
.badge-アンケート回収済{background:var(--orange-bg);color:var(--orange)}
.badge-NG{background:var(--red-bg);color:var(--red)}

/* プログレスバー */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-label{font-size:12px;color:var(--text2);width:110px;flex-shrink:0}
.progress-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.progress-num{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;width:32px;text-align:right}

/* 編集ボタン */
.edit-btn{padding:4px 10px;border-radius:6px;border:0.5px solid var(--border);font-size:11px;cursor:pointer;background:transparent;color:var(--text3);transition:all .15s;font-family:'Noto Sans JP',sans-serif}
.edit-btn:hover{border-color:var(--blue);color:var(--blue)}
.edit-btn.active{border-color:var(--green);color:var(--green)}

/* 入力フォーム */
.input-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-label{font-size:11px;color:var(--text3)}
.input-field{background:var(--bg3);border:0.5px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text);font-family:'Noto Sans JP',sans-serif;width:100%}
.input-field:focus{outline:none;border-color:var(--blue)}
.save-btn{padding:7px 16px;border-radius:6px;border:none;background:linear-gradient(135deg,#3b5bdb,#7950f2);color:#fff;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-weight:500}

/* チャートコンテナ */
.chart-wrap{position:relative;height:200px}
.chart-wrap.tall{height:240px}

@media(max-width:700px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="header-left">
    <div class="logo">📊</div>
    <div>
      <h1>TAKUMee 架電ダッシュボード</h1>
      <p>アンケート回収管理</p>
    </div>
  </div>
  <div class="last-update" id="last-update"></div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all',this)">全期間</button>
  <button class="filter-btn" onclick="setFilter('today',this)">今日</button>
  <button class="filter-btn" onclick="setFilter('week',this)">今週</button>
  <button class="filter-btn" onclick="setFilter('month',this)">今月</button>
</div>

<!-- KPIカード -->
<div class="kpi-grid">
  <div class="kpi-card green">
    <div class="kpi-label">📞 総架電数</div>
    <div class="kpi-num green" id="kpi-total">0<span class="kpi-unit">件</span></div>
    <div class="kpi-sub" id="kpi-total-sub">-</div>
  </div>
  <div class="kpi-card blue">
    <div class="kpi-label">✅ アポ獲得</div>
    <div class="kpi-num blue" id="kpi-appo">0<span class="kpi-unit">件</span></div>
    <div class="kpi-sub" id="kpi-appo-rate">獲得率 -</div>
  </div>
  <div class="kpi-card yellow">
    <div class="kpi-label">📋 アンケート回収</div>
    <div class="kpi-num yellow" id="kpi-survey">0<span class="kpi-unit">件</span></div>
    <div class="kpi-sub" id="kpi-survey-rate">回収率 -</div>
  </div>
  <div class="kpi-card red">
    <div class="kpi-label">📵 繋がらず</div>
    <div class="kpi-num red" id="kpi-missed">0<span class="kpi-unit">件</span></div>
    <div class="kpi-sub" id="kpi-missed-rate">未接続率 -</div>
  </div>
</div>

<!-- グラフ行1 -->
<div class="grid-2">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span></span>ステータス別件数</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-status"></canvas>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span style="background:var(--green)"></span>日別架電推移</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-daily"></canvas>
    </div>
  </div>
</div>

<!-- グラフ行2 -->
<div class="grid-2">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span style="background:var(--purple)"></span>担当者別実績</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-rep"></canvas>
    </div>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span style="background:var(--yellow)"></span>流入媒体別</div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-source"></canvas>
    </div>
  </div>
</div>

<!-- 集計テーブル -->
<div class="grid-2">
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span style="background:var(--orange)"></span>ステータス別集計</div>
    </div>
    <table class="stat-table">
      <thead><tr><th>ステータス</th><th>件数</th><th>割合</th></tr></thead>
      <tbody id="table-status"></tbody>
    </table>
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-title"><span style="background:var(--purple)"></span>担当者別集計</div>
    </div>
    <table class="stat-table">
      <thead><tr><th>担当者</th><th>架電</th><th>アポ</th><th>回収</th></tr></thead>
      <tbody id="table-rep"></tbody>
    </table>
  </div>
</div>

<!-- データ入力 -->
<div class="card" style="margin-top:12px">
  <div class="card-header">
    <div class="card-title"><span style="background:var(--green)"></span>データ入力（手動）</div>
    <button class="edit-btn active" id="toggle-input" onclick="toggleInput()">+ データを追加</button>
  </div>
  <div id="input-form" style="display:none">
    <div class="input-grid">
      <div class="input-group">
        <div class="input-label">日付</div>
        <input type="date" class="input-field" id="in-date">
      </div>
      <div class="input-group">
        <div class="input-label">担当者</div>
        <input type="text" class="input-field" id="in-rep" placeholder="例：明地">
      </div>
      <div class="input-group">
        <div class="input-label">架電数</div>
        <input type="number" class="input-field" id="in-calls" placeholder="0">
      </div>
      <div class="input-group">
        <div class="input-label">アポ獲得</div>
        <input type="number" class="input-field" id="in-appo" placeholder="0">
      </div>
      <div class="input-group">
        <div class="input-label">アンケート回収</div>
        <input type="number" class="input-field" id="in-survey" placeholder="0">
      </div>
      <div class="input-group">
        <div class="input-label">繋がらず</div>
        <input type="number" class="input-field" id="in-missed" placeholder="0">
      </div>
    </div>
    <button class="save-btn" onclick="addRecord()">保存する</button>
  </div>
</div>

</div>

<script>
// ---- データストア ----
let records = JSON.parse(localStorage.getItem('takumee_dash') || '[]');

// サンプルデータ（初回のみ）
if(records.length === 0){
  const today = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  const d = (n) => { const x = new Date(today); x.setDate(x.getDate()-n); return fmt(x); };
  records = [
    {date:d(6),rep:'明地',calls:20,appo:2,survey:5,missed:8},
    {date:d(5),rep:'明地',calls:25,appo:3,survey:7,missed:6},
    {date:d(5),rep:'田中',calls:18,appo:1,survey:4,missed:7},
    {date:d(4),rep:'明地',calls:22,appo:4,survey:8,missed:5},
    {date:d(4),rep:'田中',calls:20,appo:2,survey:6,missed:8},
    {date:d(3),rep:'明地',calls:28,appo:5,survey:10,missed:4},
    {date:d(2),rep:'田中',calls:15,appo:1,survey:3,missed:6},
    {date:d(1),rep:'明地',calls:30,appo:6,survey:12,missed:3},
    {date:d(0),rep:'明地',calls:10,appo:2,survey:4,missed:2},
    {date:d(0),rep:'田中',calls:8,appo:1,survey:2,missed:3},
  ];
  save();
}

let currentFilter = 'all';
let charts = {};

function save(){ localStorage.setItem('takumee_dash', JSON.stringify(records)); }

function filterRecords(){
  const today = new Date(); today.setHours(0,0,0,0);
  return records.filter(r => {
    const d = new Date(r.date);
    if(currentFilter==='today') return d >= today;
    if(currentFilter==='week'){ const w = new Date(today); w.setDate(w.getDate()-7); return d >= w; }
    if(currentFilter==='month'){ const m = new Date(today); m.setDate(m.getDate()-30); return d >= m; }
    return true;
  });
}

function setFilter(f, btn){
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleInput(){
  const f = document.getElementById('input-form');
  f.style.display = f.style.display==='none'?'block':'none';
}

function addRecord(){
  const date = document.getElementById('in-date').value;
  const rep = document.getElementById('in-rep').value;
  const calls = parseInt(document.getElementById('in-calls').value)||0;
  const appo = parseInt(document.getElementById('in-appo').value)||0;
  const survey = parseInt(document.getElementById('in-survey').value)||0;
  const missed = parseInt(document.getElementById('in-missed').value)||0;
  if(!date||!rep){ alert('日付と担当者を入力してください'); return; }
  records.push({date,rep,calls,appo,survey,missed});
  save();
  render();
  document.getElementById('input-form').style.display='none';
  ['in-date','in-rep','in-calls','in-appo','in-survey','in-missed'].forEach(id=>document.getElementById(id).value='');
}

function render(){
  const data = filterRecords();
  const total = data.reduce((a,r)=>a+r.calls,0);
  const appo = data.reduce((a,r)=>a+r.appo,0);
  const survey = data.reduce((a,r)=>a+r.survey,0);
  const missed = data.reduce((a,r)=>a+r.missed,0);
  const ng = Math.max(0, total - appo - survey - missed - Math.round(total*0.1));
  const pending = Math.round(total*0.1);

  // KPI
  document.getElementById('kpi-total').innerHTML = `${total}<span class="kpi-unit">件</span>`;
  document.getElementById('kpi-appo').innerHTML = `${appo}<span class="kpi-unit">件</span>`;
  document.getElementById('kpi-survey').innerHTML = `${survey}<span class="kpi-unit">件</span>`;
  document.getElementById('kpi-missed').innerHTML = `${missed}<span class="kpi-unit">件</span>`;
  document.getElementById('kpi-total-sub').textContent = `${data.length}日間の合計`;
  document.getElementById('kpi-appo-rate').textContent = total>0?`獲得率 ${(appo/total*100).toFixed(1)}%`:'獲得率 -';
  document.getElementById('kpi-survey-rate').textContent = total>0?`回収率 ${(survey/total*100).toFixed(1)}%`:'回収率 -';
  document.getElementById('kpi-missed-rate').textContent = total>0?`未接続率 ${(missed/total*100).toFixed(1)}%`:'未接続率 -';

  // ステータス別ドーナツ
  const statusData = [
    {label:'アポ獲得',val:appo,color:'#4ade80'},
    {label:'アンケート回収済',val:survey,color:'#fb923c'},
    {label:'再架電待ち',val:pending,color:'#60a5fa'},
    {label:'繋がらず',val:missed,color:'#fbbf24'},
    {label:'NG',val:ng,color:'#f87171'},
  ].filter(d=>d.val>0);

  renderChart('chart-status','doughnut',{
    labels: statusData.map(d=>d.label),
    datasets:[{data:statusData.map(d=>d.val),backgroundColor:statusData.map(d=>d.color),borderWidth:0,hoverOffset:4}]
  },{plugins:{legend:{position:'right',labels:{color:'#9aa0c0',font:{size:11},boxWidth:10,padding:8}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw}件`}}},cutout:'65%'});

  // 日別推移
  const byDate = {};
  data.forEach(r=>{ byDate[r.date]=(byDate[r.date]||0)+r.calls; });
  const dates = Object.keys(byDate).sort().slice(-10);
  renderChart('chart-daily','line',{
    labels: dates.map(d=>d.slice(5)),
    datasets:[{label:'架電数',data:dates.map(d=>byDate[d]),borderColor:'#4ade80',backgroundColor:'rgba(74,222,128,.1)',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:'#4ade80'}]
  },{scales:{x:{ticks:{color:'#555e80',font:{size:10}},grid:{color:'#2e3452'}},y:{ticks:{color:'#555e80',font:{size:10}},grid:{color:'#2e3452'},beginAtZero:true}},plugins:{legend:{display:false}}});

  // 担当者別
  const byRep = {};
  data.forEach(r=>{ if(!byRep[r.rep])byRep[r.rep]={calls:0,appo:0,survey:0}; byRep[r.rep].calls+=r.calls; byRep[r.rep].appo+=r.appo; byRep[r.rep].survey+=r.survey; });
  const reps = Object.keys(byRep);
  renderChart('chart-rep','bar',{
    labels: reps,
    datasets:[
      {label:'架電数',data:reps.map(r=>byRep[r].calls),backgroundColor:'rgba(96,165,250,.7)',borderRadius:4},
      {label:'アポ',data:reps.map(r=>byRep[r].appo),backgroundColor:'rgba(74,222,128,.7)',borderRadius:4},
      {label:'回収',data:reps.map(r=>byRep[r].survey),backgroundColor:'rgba(251,146,60,.7)',borderRadius:4},
    ]
  },{scales:{x:{ticks:{color:'#555e80'},grid:{display:false}},y:{ticks:{color:'#555e80',font:{size:10}},grid:{color:'#2e3452'},beginAtZero:true}},plugins:{legend:{labels:{color:'#9aa0c0',font:{size:10},boxWidth:8,padding:6}}}});

  // 流入媒体（ダミー分布）
  renderChart('chart-source','bar',{
    labels:['Web','SNS','紹介','その他'],
    datasets:[{label:'件数',data:[Math.round(total*.45),Math.round(total*.3),Math.round(total*.2),Math.round(total*.05)],backgroundColor:['rgba(96,165,250,.7)','rgba(167,139,250,.7)','rgba(74,222,128,.7)','rgba(251,191,36,.7)'],borderRadius:4}]
  },{scales:{x:{ticks:{color:'#555e80'},grid:{display:false}},y:{ticks:{color:'#555e80',font:{size:10}},grid:{color:'#2e3452'},beginAtZero:true}},plugins:{legend:{display:false},indexAxis:'y'}},{indexAxis:'y'});

  // テーブル：ステータス別
  const statuses = ['アポ獲得','アンケート回収済','再架電待ち','繋がらず','NG','未架電'];
  const vals = [appo,survey,pending,missed,ng,Math.max(0,total-appo-survey-pending-missed-ng)];
  document.getElementById('table-status').innerHTML = statuses.map((s,i)=>`
    <tr>
      <td><span class="badge badge-${s}">${s}</span></td>
      <td>${vals[i]}</td>
      <td>${total>0?(vals[i]/total*100).toFixed(1)+'%':'-'}</td>
    </tr>`).join('');

  // テーブル：担当者別
  document.getElementById('table-rep').innerHTML = reps.map(r=>`
    <tr>
      <td>${r}</td>
      <td>${byRep[r].calls}</td>
      <td style="color:var(--green)">${byRep[r].appo}</td>
      <td style="color:var(--yellow)">${byRep[r].survey}</td>
    </tr>`).join('');

  document.getElementById('last-update').textContent = '最終更新: '+new Date().toLocaleString('ja-JP');
}

function renderChart(id, type, data, options, extra={}){
  if(charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type,
    data,
    options: {
      responsive:true,
      maintainAspectRatio:false,
      ...extra,
      plugins:{ ...(options.plugins||{}) },
      scales: options.scales||undefined,
      ...options,
    }
  });
}

// 初期化
document.getElementById('in-date').value = new Date().toISOString().split('T')[0];
render();
</script>
</body>
</html>
